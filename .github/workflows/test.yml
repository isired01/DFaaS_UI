name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: go vet ./...
      - run: go test ./...

      # `npm run check` is a hand-written chain of selfchecks: a new one runs
      # only if it was appended to that chain in package.json.
      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui

      # The Dockerfile is source no Go or npm check reads: it has its own COPY
      # list and its own build command, and the operator repo shipped two
      # broken images from exactly that gap. Native arch only, no push.
      - name: Image builds
        run: docker build -t dfaas-control-plane:ci .
