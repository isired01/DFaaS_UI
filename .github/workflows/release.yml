name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Helm chart defaults every image tag to .Chart.AppVersion, which is
      # packaged without the leading v. Publish both forms so the chart resolves.
      - name: Compute version (strip leading v)
        run: echo "VERSION_NO_V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/isired01/dfaas-control-plane:${{ github.ref_name }}
            ghcr.io/isired01/dfaas-control-plane:${{ env.VERSION_NO_V }}
            ghcr.io/isired01/dfaas-control-plane:latest
